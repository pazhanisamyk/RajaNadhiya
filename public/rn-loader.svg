<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="rnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b68a45" />
      <stop offset="50%" stop-color="#f5e1b5" />
      <stop offset="100%" stop-color="#7c2526" />
    </linearGradient>

    <radialGradient id="rnGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b68a45" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#eab8ba" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter id="rnDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c2526" flood-opacity="0.25" />
    </filter>

    <style>
      .spin-ring {
        transform-origin: 160px 160px;
        animation: rnSpin 5s linear infinite;
      }
      .spin-rev {
        transform-origin: 160px 160px;
        animation: rnSpinRev 8.5s linear infinite;
      }
      .pulse-glow {
        transform-origin: 160px 160px;
        animation: rnPulse 2.4s ease-in-out infinite alternate;
      }
      .breath-logo {
        transform-origin: 160px 160px;
        animation: rnBreath 2.4s ease-in-out infinite alternate;
      }
      .sparkle {
        animation: rnSparkle 2s ease-in-out infinite alternate;
      }
      @keyframes rnSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rnSpinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes rnPulse {
        0% { opacity: 0.45; transform: scale(0.92); }
        100% { opacity: 0.95; transform: scale(1.08); }
      }
      @keyframes rnBreath {
        0% { transform: scale(0.96); }
        100% { transform: scale(1.04); }
      }
      @keyframes rnSparkle {
        0% { opacity: 0.25; transform: scale(0.85); }
        100% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="160" cy="160" r="140" fill="url(#rnGlow)" class="pulse-glow" />

  <!-- Outer Orbit Rings -->
  <circle cx="160" cy="160" r="148" fill="none" stroke="rgba(182, 138, 69, 0.25)" stroke-width="1.5" />
  <circle cx="160" cy="160" r="148" fill="none" stroke="url(#rnGold)" stroke-width="3" stroke-dasharray="140 220" stroke-linecap="round" class="spin-ring" />
  <circle cx="160" cy="160" r="132" fill="none" stroke="rgba(124, 37, 38, 0.35)" stroke-width="1.2" stroke-dasharray="6 10" class="spin-rev" />

  <!-- Decorative Orbit Nodes -->
  <g class="spin-ring">
    <circle cx="160" cy="12" r="3.5" fill="#b68a45" />
    <circle cx="160" cy="308" r="3.5" fill="#b68a45" />
  </g>

  <!-- Central Monogram Image -->
  <g class="breath-logo" filter="url(#rnDrop)">
    <image href="/rn-logo.png" x="70" y="70" width="180" height="180" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- Golden Accent Sparkles -->
  <path d="M70 70 Q75 60 80 70 Q75 80 70 70 Z" fill="#b68a45" class="sparkle" />
  <path d="M245 240 Q250 232 255 240 Q250 248 245 240 Z" fill="#eab8ba" class="sparkle" style="animation-delay: 0.6s;" />
  <path d="M250 80 Q254 74 258 80 Q254 86 250 80 Z" fill="#b68a45" class="sparkle" style="animation-delay: 1.1s;" />
</svg>

